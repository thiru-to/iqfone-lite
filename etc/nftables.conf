#!/usr/sbin/nft -f
# NOTE: Docker published ports are DNAT'd and traverse FORWARD, not INPUT.
# This ruleset does NOT filter them. Postgres must be bound to 127.0.0.1 by
# Docker itself (-p 127.0.0.1:5432:5432); the firewall cannot rescue it.

flush ruleset

define ssh_admin   = { 203.0.113.0/24 }
define bulkvs_nets = { 198.51.100.0/24 }
define rtp_ports   = 16384-32768

table inet filter {
  chain input {
    type filter hook input priority filter; policy drop;

    ct state established,related accept
    ct state invalid drop
    iif lo accept

    ip protocol icmp icmp type { echo-request, destination-unreachable, time-exceeded } accept
    ip6 nexthdr ipv6-icmp accept

    tcp dport 22 ip saddr $ssh_admin accept

    # softphones: TLS only (P5 internal profile is tls-only)
    tcp dport 5061 accept

    # carrier signalling: external profile, restricted to BulkVS
    udp dport 5080 ip saddr $bulkvs_nets accept
    tcp dport 5080 ip saddr $bulkvs_nets accept

    udp dport $rtp_ports accept

    counter drop
  }

  chain forward {
    type filter hook forward priority filter; policy accept;
  }

  chain output {
    type filter hook output priority filter; policy accept;
  }
}
